# Docker image build verification (CUDA and ROCm) - BUILD ONLY, nothing is published.
#
# This repository is the owner's fork. The previous version of this workflow pushed to the original
# author's registries (ghcr.io/debpalash/voicestudio, ghcr.io/debpalash/omnivoice-studio and
# docker.io/palashdeb/omnivoice-studio). Those destinations are not this repository's to publish to, so every
# push (and the credentials / registry-description steps that went with them) has been removed. The image
# builds themselves are unchanged, so a broken Dockerfile, base image or dependency pin still fails CI.
#
# Publishing to ghcr.io/jweter/voicestudio is a separate, deliberate step: it needs the package created and
# the workflow permissions verified, and then a reviewed change that adds `packages: write`, a GHCR login and
# `push: true` for that one destination only. Until then this workflow cannot publish anywhere.
#
# Triggers:
#   - push to main / push of a `v*` tag  -> build both images (no push)
#   - pull_request touching the Dockerfile, deploy/ or this workflow -> build both images (no push)
#   - workflow_dispatch                  -> ad-hoc build (no push)
#
# NOTE: the Docker image is the headless web-server build of VoiceStudio (FastAPI backend + pre-built React
# frontend served over HTTP).  The Tauri desktop auto-updater and its update-channel toggle are desktop-only
# features; they do NOT apply to the Docker image.

name: Docker (build verification)

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # A local, non-registry image name: nothing here can be pushed anywhere.
  LOCAL_IMAGE: voicestudio-ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cuda:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image source commit
        id: source
        shell: bash
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Both image builds run right at the runner's disk ceiling (CUDA hit
      # ENOSPC 2026-07-16 morning; ROCm hit it the same afternoon even with
      # the original reclaim list). Reclaim everything these jobs can never
      # use - ~40-45 GB total. Keep this list identical in both jobs.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.LOCAL_IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}

      - name: Build (CUDA, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ROCm/AMD GPU image variant (#1165). Same Dockerfile, ROCm PyTorch base swapped in via the BASE_IMAGE
  # build-arg. Kept as a SEPARATE job - not a matrix leg or a second build step - so it gets a full runner disk
  # to itself: the ROCm base alone is ~10 GB compressed / ~25 GB unpacked.
  build-rocm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image source commit
        id: source
        shell: bash
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # The ROCm base (~25 GB unpacked) plus build layers need every GB.
      # Same reclaim list as the CUDA job above - keep them identical
      # (2026-07-16: ROCm hit ENOSPC with the shorter list).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.LOCAL_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}-rocm

      # cache-from only: reading the CUDA job's exported cache reuses the identical frontend-builder stage.
      # Deliberately NO cache-to - the multi-GB ROCm runtime layers would blow GitHub's 10 GB per-repo Actions
      # cache budget and evict the CUDA job's cache.
      - name: Build (ROCm, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            BASE_IMAGE=rocm/pytorch:rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.8.0
            GPU_FLAVOR=rocm
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
